<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4efe7"><title>名古屋・高山之旅</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header class="hero"><div class="kicker">NAGOYA · TAKAYAMA</div><h1 id="title"></h1><div class="sub"><span id="dates"></span>｜<span id="group"></span></div></header>

<section id="today" class="view active">
  <div class="card highlight"><div class="muted">目前位置</div><div class="big" id="currentPlace"></div><div id="currentStatus"></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="muted">下一站</div><div class="big" id="nextStop"></div></div>
  <div class="card"><img id="todayImage" class="photo"><div class="section-title" id="todayTitle" style="margin-top:12px"></div><span class="badge" id="todayTransport"></span></div>
  <div class="card"><div class="section-title">今天怎麼走</div><div class="timeline" id="todayTimeline"></div></div>
  <div class="card"><div class="row between"><div class="section-title">今天可能吃什麼</div><span class="badge orange">最多 3 間</span></div><div class="restaurant-grid" id="todayRestaurants"></div></div>
  <div class="card"><div class="muted">今晚住宿</div><div class="big" id="todayStay"></div></div>
</section>

<section id="itinerary" class="view"><div id="days"></div></section>

<section id="aiView" class="view">
  <div class="card"><div class="section-title">旅遊 AI 小幫手</div><div class="note">長輩可以直接問「今晚住哪？」「明天去哪？」「幾點回台灣？」。這個原型先用行程資料回答。</div><div id="chat"><div class="ai-msg ai">你好！有問題直接問我就可以。</div></div><div class="row"><input id="aiInput" class="search" placeholder="例如：今天晚上住哪？" onkeydown="if(event.key==='Enter')askAI()"><button class="btn primary" onclick="askAI()">送出</button></div></div>
</section>

<section id="mine" class="view">
  <div class="card"><div class="section-title">我的旅程資料庫</div><input class="search" placeholder="搜尋訂單、飯店、餐廳、景點（版面示範）"><div class="note" style="margin-top:8px">訂單截圖只放在你的版本，不顯示給家人。</div></div><div id="bookings"></div>
</section>

<section id="admin" class="view">
  <div class="card form"><div class="row between"><button class="btn" onclick="adminPrev()">‹</button><div class="section-title" id="adminDay"></div><button class="btn" onclick="adminNext()">›</button></div>
    <label>目前位置</label><input id="adminCurrent">
    <label>目前狀態</label><input id="adminStatus">
    <label>下一站</label><input id="adminNext">
    <label>當日標題</label><input id="adminTitle">
    <label>交通方式</label><input id="adminTransport">
    <label>餐廳候選（每行一間，最多 3 間）</label><textarea id="adminRestaurants"></textarea>
    <button class="btn primary" style="width:100%;margin-top:14px" onclick="saveAdmin()">儲存更新</button>
    <div class="note" style="margin-top:10px">這個第一版會把修改存在目前手機的瀏覽器。若要讓你更新後「家人的手機立刻同步」，下一版需要接雲端資料庫。</div>
  </div>
</section>

<nav class="nav">
<button class="active" onclick="nav('today',this)">⌂<br>今天</button>
<button onclick="nav('itinerary',this)">▦<br>行程</button>
<button onclick="nav('aiView',this)">○<br>問 AI</button>
<button onclick="nav('mine',this)">▣<br>我的旅程</button>
<button onclick="nav('admin',this)">⚙<br>管理</button>
</nav>
</main><script src="app.js"></script></body></html>
