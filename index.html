<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f4ef"><title>黃家家庭旅遊</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="hero"><div class="kicker">FAMILY TRIP</div><h1 id="title"></h1><div class="sub"><span id="subtitle"></span>｜<span id="dates"></span></div></header><section id="today" class="view active"><div class="card highlight"><div class="muted">目前位置</div><div class="big" id="currentPlace"></div><div id="currentStatus"></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><div class="muted">下一站</div><div class="big" id="nextStop"></div></div><div class="card"><img id="todayImage" class="photo"><div class="section-title" id="todayTitle" style="margin-top:12px"></div><span class="badge" id="todayTransport"></span></div><div class="card"><div class="section-title">今天怎麼走</div><div class="timeline" id="todayTimeline"></div></div><div class="card"><div class="row between"><div class="section-title">今天可能吃什麼</div><span class="badge orange">候選</span></div><div id="todayRestaurants"></div></div><div class="card"><div class="muted">今晚住宿</div><div class="big" id="todayStay"></div></div></section><section id="itinerary" class="view"><div id="days"></div></section><section id="aiView" class="view"><div class="card"><div class="section-title">旅遊 AI 小幫手</div><div id="chat"><div class="ai-msg ai">你好！有問題直接問我就可以。</div></div><div class="row"><input id="aiInput" class="search" placeholder="例如：今天晚上住哪？" onkeydown="if(event.key==='Enter')askAI()"><button class="btn primary" onclick="askAI()">送出</button></div></div></section><section id="mine" class="view"><div class="card"><div class="section-title">我的旅程</div><div class="note">私人訂單截圖之後再接登入／雲端，不放在公開 GitHub Pages。</div></div></section><section id="admin" class="view"><div class="card"><div class="section-title">管理模式</div><div class="note">下一版再接雲端同步。</div></div></section><nav class="nav"><button class="active" onclick="nav('today',this)">⌂<br>今天</button><button onclick="nav('itinerary',this)">▦<br>行程</button><button onclick="nav('aiView',this)">○<br>問 AI</button><button onclick="nav('mine',this)">▣<br>我的旅程</button><button onclick="nav('admin',this)">⚙<br>管理</button></nav></main><script src="app.js"></script></body></html>
